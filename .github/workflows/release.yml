name: Release

# Publishes the gem to rubygems.org when a version tag is pushed. Publishing
# uses a rubygems.org trusted publisher, so no API key is stored here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain from mise.toml
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Check the tag matches the gem version
        run: |
          version="v$(ruby -e 'print Gem::Specification.load("service_mesh.gemspec").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match gem version $version"
            exit 1
          fi

      - name: Get rubygems.org credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Build and push
        run: |
          gem build service_mesh.gemspec --output service_mesh.gem
          gem push service_mesh.gem
